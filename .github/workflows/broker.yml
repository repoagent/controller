name: Broker
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select broker delivery, rollback, access check or guarded recovery
        type: choice
        options: [access-check, diagnostics, verify, deploy, release, deploy-release, deploy-image, bootstrap-publish, foundation-plan, foundation-apply, stage-plan, stage-apply, promote-staged, stage-stop, stage-resume, cleanup-identity-plan, cleanup-identity-apply, cleanup-plan, cleanup-apply]
        default: access-check
        required: true
      expected-source-sha:
        description: Exact accepted current main commit (required for diagnostics, bootstrap and activation operations)
        type: string
      image:
        description: Accepted immutable broker image digest (deploy-image or runtime recovery)
        type: string
      release-tag:
        description: Approved broker-vMAJOR.MINOR.PATCH release for publication or rollback
        type: string
      revision:
        description: Exact accepted staging revision (stop/resume only)
        type: string
  push:
    branches: [main]
    paths: &auth-paths
      - 'service/auth/**'
      - 'infra/auth/**'
      - 'scripts/delivery/auth-pipeline.py'
      - 'scripts/delivery/broker-release.py'
      - 'scripts/delivery/broker-diagnostics.py'
      - 'scripts/delivery/test_broker_diagnostics.py'
      - 'scripts/delivery/test_broker_release.py'
      - 'scripts/delivery/test_broker_version.py'
      - 'scripts/delivery/test_*auth*.py'
      - '.github/workflows/broker.yml'
      - 'global.json'
      - 'RepoAgent.slnx'
      - 'scripts/delivery/verify-dotnet.sh'
      - '.editorconfig'
      - '.globalconfig'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'NuGet.Config'
      - 'nuget.config'
  pull_request:
    paths: *auth-paths
permissions:
  contents: read
concurrency:
  group: broker-${{ github.event_name == 'pull_request' && github.ref || 'delivery' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  BICEP_VERSION: v0.48.1
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AUTH_APP_NAME: ${{ vars.AUTH_APP_NAME }}
  AUTH_STORAGE_ACCOUNT_NAME: ${{ vars.AUTH_STORAGE_ACCOUNT_NAME }}
  AUTH_KEY_VAULT_NAME: ${{ vars.AUTH_KEY_VAULT_NAME }}
  AUTH_IMAGE_REPOSITORY: ${{ vars.AUTH_IMAGE_REPOSITORY }}
  AUTH_SIGNING_KEY_URI: ${{ vars.AUTH_SIGNING_KEY_URI }}
  AUTH_DATA_PROTECTION_KEY_URI: ${{ vars.AUTH_DATA_PROTECTION_KEY_URI }}
  AUTH_TABLE_NAME: ${{ vars.AUTH_TABLE_NAME }}
  AUTH_DEPLOYMENT_EPOCH: ${{ vars.AUTH_DEPLOYMENT_EPOCH }}
  AUTH_REQUEST_LIMIT_PER_MINUTE: ${{ vars.AUTH_REQUEST_LIMIT_PER_MINUTE }}
  AUTH_CONCURRENT_REQUEST_LIMIT: ${{ vars.AUTH_CONCURRENT_REQUEST_LIMIT }}
  AUTH_REQUEST_TIMEOUT_SECONDS: ${{ vars.AUTH_REQUEST_TIMEOUT_SECONDS }}
jobs:
  diagnostics:
    if: github.repository == 'repoagent/controller' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AUTH_EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
      # Do not carry unrelated live configuration into the diagnostics process or step logs.
      AUTH_SIGNING_KEY_URI: ''
      AUTH_DATA_PROTECTION_KEY_URI: ''
      AUTH_DEPLOYMENT_EPOCH: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Sign in with the existing resource-group identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Collect bounded read-only operator evidence
        run: python3 scripts/delivery/broker-diagnostics.py "$RUNNER_TEMP/broker-diagnostics"
      - name: Retain only the allowlisted report, including partial evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broker-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/broker-diagnostics/diagnostics.json
          if-no-files-found: warn
          retention-days: 7
  access-check:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'access-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify resource group and Bicep deployment access
        shell: bash
        env:
          DEPLOYMENT_NAME: github-oidc-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          az bicep install --version "$BICEP_VERSION"
          test "$(az group show --name "$AZURE_RESOURCE_GROUP" --query location --output tsv)" = "$AZURE_LOCATION"
          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/auth/verify-access.bicep \
            --mode Incremental \
            --query properties.outputs \
            --output json
  select-release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'deploy' || inputs.operation == 'release')))
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.select.outputs.release }}
      source: ${{ steps.select.outputs.source }}
      version: ${{ steps.select.outputs.version }}
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select only an approved broker release from main history
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_RELEASE_TAG: ${{ inputs.release-tag }}
        run: python3 scripts/delivery/broker-release.py plan
  verify-service:
    needs: select-release
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'verify' || inputs.operation == 'deploy' || inputs.operation == 'release') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.select-release.outputs.source || github.sha }}
          persist-credentials: false
      - name: Require real service and infrastructure sources
        run: python3 scripts/delivery/auth-pipeline.py source
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: service/auth/global.json
      - name: Verify the service and compile Bicep without cloud credentials
        run: |
          az bicep install --version "$BICEP_VERSION"
          export BICEP_BIN="$HOME/.azure/bin/bicep"
          (cd service/auth && bash verify.sh)
          for template in infra/auth/*.bicep; do
            "$BICEP_BIN" build "$template" --stdout >/dev/null
          done
          python3 -m unittest discover -s scripts/delivery -p 'test_*auth*.py' -v
          python3 -m unittest scripts.delivery.test_broker_release scripts.delivery.test_broker_version -v
          python3 -m venv "$RUNNER_TEMP/broker-diagnostics-tests"
          "$RUNNER_TEMP/broker-diagnostics-tests/bin/pip" install --disable-pip-version-check jmespath==1.0.1
          "$RUNNER_TEMP/broker-diagnostics-tests/bin/python" -m unittest scripts.delivery.test_broker_diagnostics -v
  publish:
    needs: [select-release, verify-service]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'deploy' || inputs.operation == 'release'))) && needs.verify-service.result == 'success' && needs.select-release.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      source: ${{ steps.publish.outputs.source }}
      version: ${{ steps.publish.outputs.version }}
      tag: ${{ steps.publish.outputs.tag }}
      artifact: ${{ steps.metadata.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.select-release.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check source and dedicated image repository before publication
        run: python3 scripts/delivery/auth-pipeline.py check
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Sign in to dedicated GitHub registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Build verified source, inspect role/user, publish and resolve immutable digest
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_RELEASE_TAG: ${{ needs.select-release.outputs.tag }}
          AUTH_RELEASE_MANIFEST: ${{ runner.temp }}/broker-release.json
        run: python3 scripts/delivery/broker-release.py publish
      - name: Retain verified nonsecret release mapping
        id: metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broker-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/broker-release.json
          if-no-files-found: error
          retention-days: 7
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io
  release-metadata:
    needs: publish
    if: github.ref == 'refs/heads/main' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.publish.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.publish.outputs.artifact }}
          path: ${{ runner.temp }}/broker-publication
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Record the exact version mapping without replacing approved release notes or assets
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          AUTH_RELEASE_MANIFEST: ${{ runner.temp }}/broker-publication/broker-release.json
        run: python3 scripts/delivery/broker-release.py record
  deploy:
    needs: [publish, release-metadata]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && ((needs.publish.result == 'success' && needs.release-metadata.result == 'success') || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'deploy-image' || inputs.operation == 'deploy-release'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      AUTH_IMAGE: ${{ inputs.operation == 'deploy-image' && inputs.image || needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Resolve the selected released version for deliberate rollback
        if: inputs.operation == 'deploy-release'
        id: rollback
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_RELEASE_TAG: ${{ inputs.release-tag }}
        run: python3 scripts/delivery/broker-release.py resolve
      - name: Verify anonymous immutable auth image before any infrastructure write
        env:
          AUTH_IMAGE: ${{ steps.rollback.outputs.image || env.AUTH_IMAGE }}
          AUTH_EXPECTED_IMAGE_SOURCE_SHA: ${{ steps.rollback.outputs.source || needs.publish.outputs.source }}
          AUTH_EXPECTED_BROKER_VERSION: ${{ steps.rollback.outputs.version || needs.publish.outputs.version }}
        run: |
          python3 scripts/delivery/auth-pipeline.py attest
          bash infra/auth/deploy.sh check
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy API and cleanup from one digest and verify Azure and HTTPS
        env:
          AUTH_IMAGE: ${{ steps.rollback.outputs.image || env.AUTH_IMAGE }}
          AUTH_EXPECTED_IMAGE_SOURCE_SHA: ${{ steps.rollback.outputs.source || needs.publish.outputs.source }}
          AUTH_EXPECTED_BROKER_VERSION: ${{ steps.rollback.outputs.version || needs.publish.outputs.version }}
        run: |
          az bicep install --version "$BICEP_VERSION"
          export BICEP_BIN="$HOME/.azure/bin/bicep"
          bash infra/auth/deploy.sh apply

  bootstrap-publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap-publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      AUTH_EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
      AUTH_IMAGE_REPOSITORY: ghcr.io/repoagent/controller-auth
      AUTH_PACKAGE_ACTIONS_ACCESS_CONFIRMED: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: service/auth/global.json
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Bootstrap accepted source with temporary registry credentials
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          BOOTSTRAP_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOOTSTRAP_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/auth-bootstrap-docker.XXXXXX")"
          export DOCKER_CONFIG
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf 'Bootstrap run: %s attempt %s\n' "$BOOTSTRAP_RUN_URL" "$BOOTSTRAP_RUN_ATTEMPT"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          unset REGISTRY_TOKEN
          python3 scripts/delivery/auth-pipeline.py bootstrap-publish-actions

  activation:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && contains(fromJSON('["foundation-plan","foundation-apply","stage-plan","stage-apply","promote-staged","stage-stop","stage-resume","cleanup-identity-plan","cleanup-identity-apply","cleanup-plan","cleanup-apply"]'), inputs.operation)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      AUTH_OPERATION: ${{ inputs.operation }}
      AUTH_EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
      AUTH_IMAGE: ${{ inputs.image }}
      AUTH_STAGE_REVISION: ${{ inputs.revision }}
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - if: ${{ !startsWith(inputs.operation, 'foundation-') && !startsWith(inputs.operation, 'cleanup-identity-') }}
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run the accepted operation with existing guarded infrastructure
        shell: bash
        run: |
          set -euo pipefail
          az bicep install --version "$BICEP_VERSION"
          export BICEP_BIN="$HOME/.azure/bin/bicep"
          case "$AUTH_OPERATION" in
            foundation-plan|foundation-apply|stage-plan|stage-apply|promote-staged|stage-stop|stage-resume|cleanup-identity-plan|cleanup-identity-apply|cleanup-plan|cleanup-apply)
              bash infra/auth/deploy.sh "$AUTH_OPERATION" ;;
            *) exit 1 ;;
          esac
