name: Controller infrastructure
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infra/controller/**'
      - 'tests/controller/**'
      - 'scripts/azure/**'
      - 'scripts/update-azure-controller.ps1'
      - '.github/workflows/ci-controller-infra.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: az bicep install --version v0.48.1
      - run: |
          for template in infra/controller/*.bicep; do
            "$HOME/.azure/bin/bicep" build "$template" --outfile "$RUNNER_TEMP/$(basename "$template" .bicep).json"
          done
      - run: python3 -m unittest discover -s tests/controller -v
  windows-update-state:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - shell: pwsh
        run: |
          python -m unittest discover -s tests/controller -p test_azure_update_state.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
