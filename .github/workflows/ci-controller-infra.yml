name: Controller infrastructure
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infra/controller/**'
      - '.github/workflows/ci-controller-infra.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: az bicep install --version v0.48.1
      - run: |
          for template in infra/controller/*.bicep; do
            "$HOME/.azure/bin/bicep" build "$template" --outfile "$RUNNER_TEMP/$(basename "$template" .bicep).json"
          done
