name: Controller macOS (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-owned-processes-macos:
    concurrency:
      group: controller-owned-processes-macos-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Exercise launcher source from a CRLF checkout
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          source = Path('src/RepoAgentController/OwnedAgentProcesses.cs')
          source.write_bytes(source.read_bytes().replace(b'\r\n', b'\n').replace(b'\n', b'\r\n'))
          PYTHON
      - name: Build the native owned-process gate
        timeout-minutes: 6
        run: dotnet build tests/RepoAgentController.Tests --configuration Release --nologo
      - name: Confirm native owned-process shutdown and private activity inspection
        timeout-minutes: 5
        run: |
          set -euo pipefail
          dotnet tests/RepoAgentController.Tests/bin/Release/net11.0/RepoAgentController.Tests.dll \
            -class RepoAgentController.Tests.BrokerLifetimeTests -class RepoAgentController.Tests.ControllerShutdownTests \
            -class RepoAgentController.Tests.ActivitySocketTests \
            -result-xml "$RUNNER_TEMP/owned-processes.xml"
          /usr/bin/python3 - "$RUNNER_TEMP/owned-processes.xml" <<'PYTHON'
          import sys, xml.etree.ElementTree as ET
          assemblies = ET.parse(sys.argv[1]).getroot().findall('assembly')
          if not assemblies or sum(int(a.attrib['total']) for a in assemblies) == 0 or any(int(a.attrib['skipped']) for a in assemblies):
              sys.exit('Owned-process gate requires actual test execution without skips')
          if not any(t.attrib.get('name', '').startswith('RepoAgentController.Tests.ActivitySocketTests.') and t.attrib.get('result') == 'Pass'
                     for a in assemblies for t in a.findall('./collection/test')):
              sys.exit('Private activity gate requires actual socket/CLI test execution')
          PYTHON
