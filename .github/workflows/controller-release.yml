name: Controller release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Approved Release Please controller-vMAJOR.MINOR.PATCH tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: controller-semantic-release
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'repoagent/controller' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source: ${{ steps.plan.outputs.source }}
      version: ${{ steps.plan.outputs.version }}
      complete: ${{ steps.plan.outputs.complete }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact reviewed source and notes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
          python3 scripts/delivery/controller-release.py select "$RELEASE_TAG" "$RUNNER_TEMP/controller-plan"
          jq -r '"source=\(.source)\nversion=\(.version)\ncomplete=\(.complete)"' "$RUNNER_TEMP/controller-plan/plan.json" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: controller-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/controller-plan/
          if-no-files-found: error
  build:
    needs: select
    if: needs.select.outputs.complete != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    env:
      SOURCE_COMMIT: ${{ needs.select.outputs.source }}
      VERSION: ${{ needs.select.outputs.version }}
      IMAGE: repoagent-controller:semantic-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.select.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.select.outputs.artifact }}
          path: ${{ runner.temp }}/controller-plan
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify and package the one approved version
        run: |
          set -euo pipefail
          bash scripts/delivery/verify.sh "$RUNNER_TEMP/controller-image" "$VERSION"
          python3 scripts/compose-image.py --source . --manifest image/default.json --output "$RUNNER_TEMP/context"
          cmp "$RUNNER_TEMP/controller-plan/RELEASE_NOTES.md" "$RUNNER_TEMP/context/releases/controller/RELEASE_NOTES.md"
          docker buildx build --platform linux/amd64 --target runtime --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --metadata-file "$RUNNER_TEMP/controller-image/build.json" \
            --output "type=docker,dest=$RUNNER_TEMP/controller-image/controller.tar" \
            --tag "$IMAGE" --file "$RUNNER_TEMP/context/container/Containerfile" "$RUNNER_TEMP/context"
          docker load --input "$RUNNER_TEMP/controller-image/controller.tar"
          docker run --rm --network none "$IMAGE" versions > "$RUNNER_TEMP/controller-image/versions.txt"
          docker run --rm --network none --entrypoint cat "$IMAGE" /opt/repoagent/image-inventory.json > "$RUNNER_TEMP/controller-image/image-inventory.json"
          docker run --rm --network none --entrypoint cat "$IMAGE" /opt/repoagent/controller/RELEASE_NOTES.md > "$RUNNER_TEMP/controller-image/RELEASE_NOTES.md"
          docker run --rm --network none --entrypoint /opt/repoagent/native-smoke/NativeSmoke "$IMAGE"
          cmp "$RUNNER_TEMP/controller-plan/RELEASE_NOTES.md" "$RUNNER_TEMP/controller-image/RELEASE_NOTES.md"
          python3 scripts/delivery/image-release.py check "$RUNNER_TEMP/controller-image"
          cp "$RUNNER_TEMP/controller-plan/plan.json" "$RUNNER_TEMP/controller-image/plan.json"
          (cd "$RUNNER_TEMP/controller-image" && sha256sum ./* > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: controller-semantic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/controller-image/
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: [select, build]
    if: needs.select.outputs.complete != 'true'
    environment: controller-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      reference: ${{ steps.publish.outputs.reference }}
    env:
      SOURCE_COMMIT: ${{ needs.select.outputs.source }}
      VERSION: ${{ needs.select.outputs.version }}
      IMAGE: repoagent-controller:semantic-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.select.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/controller-image
      - name: Verify transferred artifacts and positive registry absence
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
          (cd "$RUNNER_TEMP/controller-image" && sha256sum --check SHA256SUMS)
          python3 scripts/delivery/image-release.py check "$RUNNER_TEMP/controller-image"
          python3 scripts/delivery/controller-release.py image-free "$VERSION"
          docker load --input "$RUNNER_TEMP/controller-image/controller.tar"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}:{{.Config.User}}:{{index .Config.Labels "io.repoagent.role"}}:{{index .Config.Labels "org.opencontainers.image.revision"}}:{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE")" = "linux/amd64:1000:controller:$SOURCE_COMMIT:$VERSION"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish once and verify anonymous immutable access
        id: publish
        run: |
          set -euo pipefail
          candidate="ghcr.io/repoagent/controller:sha-$SOURCE_COMMIT-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag "$IMAGE" "$candidate"
          docker push "$candidate"
          auth=$(mktemp)
          anonymous=$(mktemp -d)
          printf '{"auths":{}}' > "$auth"
          trap 'rm -rf "$auth" "$anonymous"' EXIT
          digest=$(skopeo inspect --authfile "$auth" --no-creds --format '{{.Digest}}' "docker://$candidate")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          immutable="ghcr.io/repoagent/controller@$digest"
          skopeo copy --src-authfile "$auth" --src-no-creds --preserve-digests "docker://$immutable" "dir:$anonymous"
          test "$(jq -er '.config.digest' "$anonymous/manifest.json")" = "$(jq -er '."containerimage.config.digest"' "$RUNNER_TEMP/controller-image/build.json")"
          python3 scripts/delivery/controller-release.py image-free "$VERSION"
          reference="ghcr.io/repoagent/controller:controller-v$VERSION"
          docker tag "$IMAGE" "$reference"
          docker push "$reference"
          test "$(skopeo inspect --authfile "$auth" --no-creds --format '{{.Digest}}' "docker://$reference")" = "$digest"
          printf 'image=%s\nreference=%s\n' "$immutable" "$reference" >> "$GITHUB_OUTPUT"
  finalize:
    needs: [select, build, publish]
    if: needs.select.outputs.complete != 'true'
    environment: controller-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ needs.select.outputs.source }}
      IMAGE: ${{ needs.publish.outputs.image }}
      REFERENCE: ${{ needs.publish.outputs.reference }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.select.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/controller-image
      - name: Publish verified native assets and release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/controller-image" && sha256sum --check SHA256SUMS)
          python3 scripts/delivery/controller-release.py finalize "$RUNNER_TEMP/controller-image" "$RUNNER_TEMP/controller-image/plan.json"
