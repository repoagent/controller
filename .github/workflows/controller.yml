name: Controller
on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Run the disposable hosted installer smoke on this branch without publishing
        type: boolean
        default: false
      tag:
        description: Optional existing vMAJOR.MINOR.PATCH tag on main for a native release; omit for a baseline image
        type: string
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'install*'
      - 'repoagent*'
      - 'Directory.*'
      - 'NuGet.*'
      - 'nuget.config'
      - '.editorconfig'
      - '.globalconfig'
      - 'container/**'
      - 'image/**'
      - 'global.json'
      - 'RepoAgent.slnx'
      - '.agents/skills/github-discussion/**'
      - '.agents/skills/repoagent-orientation/**'
      - 'scripts/**'
      - '.github/workflows/controller.yml'
      - '.github/workflows/e2e-smoke.yml'
      - '.github/workflows/broker.yml'
      - '.github/workflows/refresh-baseline-tool.yml'
      - '.github/workflows/refresh-baseline-tools.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'install*'
      - 'repoagent*'
      - 'Directory.*'
      - 'NuGet.*'
      - 'nuget.config'
      - '.editorconfig'
      - '.globalconfig'
      - 'container/**'
      - 'image/**'
      - 'global.json'
      - 'RepoAgent.slnx'
      - '.agents/skills/github-discussion/**'
      - '.agents/skills/repoagent-orientation/**'
      - 'scripts/**'
      - '.github/workflows/controller.yml'
      - '.github/workflows/e2e-smoke.yml'
      - '.github/workflows/broker.yml'
      - '.github/workflows/refresh-baseline-tool.yml'
      - '.github/workflows/refresh-baseline-tools.yml'
permissions:
  contents: read
jobs:
  hosted-smoke:
    if: github.repository == 'repoagent/controller' && github.event_name == 'workflow_dispatch' && inputs.smoke == true && inputs.tag == ''
    uses: ./.github/workflows/e2e-smoke.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write
  build:
    concurrency:
      group: controller-build-${{ github.ref }}
      cancel-in-progress: true
    if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && inputs.tag == '' && inputs.smoke != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: repoagent-controller:${{ github.sha }}
    outputs:
      artifact-id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compose and build the exact source inventory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/controller-image"
          python3 scripts/compose-image.py --source . --manifest image/default.json --output "$RUNNER_TEMP/context"
          docker buildx build --platform linux/amd64 --target runtime \
            --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --metadata-file "$RUNNER_TEMP/controller-image/build.json" \
            --output "type=docker,dest=$RUNNER_TEMP/controller-image/controller.tar" \
            --tag "$IMAGE" --file "$RUNNER_TEMP/context/container/Containerfile" "$RUNNER_TEMP/context"
      - name: Smoke the built image and record its checksum
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/controller-image"
          docker load --input controller.tar
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}:{{.Config.User}}:{{index .Config.Labels "io.repoagent.role"}}:{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "linux/amd64:1000:controller:$GITHUB_SHA"
          docker run --rm --network none "$IMAGE" versions | tee versions.txt
          docker run --rm --network none --entrypoint cat "$IMAGE" /opt/repoagent/image-inventory.json > image-inventory.json
          docker run --rm --network none --entrypoint /opt/repoagent/native-smoke/NativeSmoke "$IMAGE"
          sha256sum controller.tar build.json versions.txt image-inventory.json > SHA256SUMS
      - name: Check release metadata for the bundled versions
        run: python3 scripts/delivery/image-release.py check "$RUNNER_TEMP/controller-image"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: archive
        with:
          name: controller-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/controller-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  verify-artifact:
    concurrency:
      group: controller-verify-artifact-${{ github.ref }}
      cancel-in-progress: true
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: repoagent-controller:${{ github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/controller-image
      - name: Verify the transferred image before publication can be approved
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/controller-image"
          sha256sum --check SHA256SUMS
          docker load --input controller.tar
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}:{{.Config.User}}:{{index .Config.Labels "io.repoagent.role"}}:{{index .Config.Labels "org.opencontainers.image.revision"}}:{{index .Config.Labels "org.opencontainers.image.source"}}' "$IMAGE")" = "linux/amd64:1000:controller:$GITHUB_SHA:https://github.com/$GITHUB_REPOSITORY"
  verify:
    concurrency:
      group: controller-verify-${{ github.ref }}
      cancel-in-progress: true
    if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && inputs.tag == '' && inputs.smoke != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - run: bash scripts/delivery/verify.sh "$RUNNER_TEMP/controller-package"
  publish:
    concurrency:
      group: controller-publish
      cancel-in-progress: false
    needs: [build, verify-artifact, verify]
    if: github.repository == 'repoagent/controller' && github.ref == 'refs/heads/main' && inputs.tag == '' && inputs.smoke != true && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: controller-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      reference: ${{ steps.publish.outputs.reference }}
    env:
      IMAGE: repoagent-controller:${{ github.sha }}
      REFERENCE: ghcr.io/repoagent/controller:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/controller-image
      - name: Verify and load the approved build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/controller-image"
          sha256sum --check SHA256SUMS
          docker load --input controller.tar
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}:{{.Config.User}}:{{index .Config.Labels "io.repoagent.role"}}:{{index .Config.Labels "org.opencontainers.image.revision"}}:{{index .Config.Labels "org.opencontainers.image.source"}}' "$IMAGE")" = "linux/amd64:1000:controller:$GITHUB_SHA:https://github.com/$GITHUB_REPOSITORY"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish and require anonymous immutable image access
        id: publish
        run: |
          set -euo pipefail
          docker tag "$IMAGE" "$REFERENCE"
          docker push "$REFERENCE"
          sudo apt-get update
          sudo apt-get install -y skopeo
          auth=$(mktemp)
          anonymous=$(mktemp -d)
          printf '{"auths":{}}' > "$auth"
          trap 'rm -rf "$auth" "$anonymous"' EXIT
          digest=$(skopeo inspect --authfile "$auth" --no-creds --format '{{.Digest}}' "docker://$REFERENCE")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          immutable="ghcr.io/repoagent/controller@$digest"
          skopeo copy --src-authfile "$auth" --src-no-creds --preserve-digests "docker://$immutable" "dir:$anonymous"
          test "$(jq -er '.config.digest' "$anonymous/manifest.json")" = "$(jq -er '."containerimage.config.digest"' "$RUNNER_TEMP/controller-image/build.json")"
          printf 'image=%s\nreference=%s\n' "$immutable" "$REFERENCE" >> "$GITHUB_OUTPUT"
          printf 'Public controller image: `%s`\n\nSource: `%s`\n' "$immutable" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
  release:
    concurrency:
      group: controller-release
      cancel-in-progress: false
    needs: [build, publish]
    if: github.repository == 'repoagent/controller' && github.ref == 'refs/heads/main' && inputs.tag == '' && inputs.smoke != true && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: controller-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/controller-image
      - name: Publish the discoverable baseline release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ needs.publish.outputs.image }}
          REFERENCE: ${{ needs.publish.outputs.reference }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/controller-image" && sha256sum --check SHA256SUMS)
          python3 scripts/delivery/image-release.py publish "$RUNNER_TEMP/controller-image"

  native-release:
    concurrency:
      group: controller-native-release
      cancel-in-progress: false
    if: github.repository == 'repoagent/controller' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.smoke != true
    environment: controller-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and select immutable tagged source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Verify and package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          bash scripts/delivery/verify.sh "$RUNNER_TEMP/release" "${RELEASE_TAG#v}"
      - name: Publish new release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # Existing release (including a partial upload) requires operator inspection.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserving all existing assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release/"* --verify-tag --title "$RELEASE_TAG" --notes "Linux amd64 controller. Source: $(git rev-parse HEAD). See docs/ci-cd.md for runtime requirements."
