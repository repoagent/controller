name: Hosted installer smoke
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      selection:
        description: Immutable tool-selection artifact ID from the selecting run
        type: string
        required: false
        default: ''
    secrets:
      REPOAGENT_E2E_GH_TOKEN:
        required: true
      OPENAI_API_KEY:
        required: true
permissions:
  contents: read
jobs:
  smoke:
    concurrency:
      group: e2e-smoke
      cancel-in-progress: false
    if: github.repository == 'repoagent/controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      IMAGE: repoagent-controller:hosted-smoke
      REPOAGENT_LIVE: '1'
      REPOAGENT_SMOKE_DIRECTORY: ${{ runner.temp }}/hosted-smoke
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.selection != ''
        with:
          artifact-ids: ${{ inputs.selection }}
          path: ${{ runner.temp }}/tool-selection
      - name: Apply the exact candidate selection
        if: inputs.selection != ''
        run: python3 scripts/delivery/tool-refresh.py apply "$RUNNER_TEMP/tool-selection/selection.json"
      - name: Install the candidate GitHub CLI on the runner
        run: |
          python3 scripts/delivery/hosted-smoke.py tools "$RUNNER_TEMP/smoke-tools"
          echo "$RUNNER_TEMP/smoke-tools" >> "$GITHUB_PATH"
      - name: Sweep owned leftovers and verify participant authority
        env:
          GH_TOKEN: ${{ secrets.REPOAGENT_E2E_GH_TOKEN }}
        run: python3 scripts/delivery/hosted-smoke.py sweep "$REPOAGENT_SMOKE_DIRECTORY"
      - name: Build the candidate without credentials
        run: |
          set -euo pipefail
          python3 scripts/compose-image.py --source . --manifest image/default.json --output "$RUNNER_TEMP/smoke-context"
          docker build --platform linux/amd64 --target runtime --tag "$IMAGE" --file "$RUNNER_TEMP/smoke-context/container/Containerfile" "$RUNNER_TEMP/smoke-context"
          docker run --rm --network none "$IMAGE" versions
      - name: Install through the fresh operator path
        env:
          GH_TOKEN: ${{ secrets.REPOAGENT_E2E_GH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/delivery/hosted-smoke.py install "$REPOAGENT_SMOKE_DIRECTORY"
      - name: Observe the real Quick Tunnel, receipt and App reply
        env:
          GH_TOKEN: ${{ secrets.REPOAGENT_E2E_GH_TOKEN }}
          REPOAGENT_LIVE: '1'
          REPOAGENT_LIVE_CASE: hosted-smoke
        run: bash scripts/live-test.sh
      - name: Close enrollment and remove every owned Discussion
        if: always()
        env:
          GH_TOKEN: ${{ secrets.REPOAGENT_E2E_GH_TOKEN }}
        run: python3 scripts/delivery/hosted-smoke.py cleanup "$REPOAGENT_SMOKE_DIRECTORY"
      - name: Retain nonsecret outcomes only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-smoke/evidence/
          if-no-files-found: warn
          retention-days: 7
  report-failure:
    needs: smoke
    if: failure() && github.repository == 'repoagent/controller'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Record the failed candidate without changing pins
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Hosted installer smoke failed for source `%s`.\n\nInspect [the run](%s) and its nonsecret outcome artifact. The candidate was not authorized for pinning; cleanup or settlement may need operator attention.\n' "$SOURCE_SHA" "$RUN_URL" > "$RUNNER_TEMP/smoke-failure.md"
          gh issue create --title "Hosted installer smoke failed for $SOURCE_SHA" --body-file "$RUNNER_TEMP/smoke-failure.md"
