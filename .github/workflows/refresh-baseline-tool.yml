name: Refresh one baseline tool
# Called by refresh-baseline-tools.yml once per tool. A newer supported release of this tool is
# verified with the selected version before it is pinned on main and published as a new baseline
# image; an unusable or incompatible release fails here, changes nothing on main and publishes
# nothing. Other tools' refreshes do not depend on this one.
on:
  workflow_call:
    inputs:
      tool:
        description: The tool to refresh, gh or codex
        required: true
        type: string
permissions:
  contents: read
jobs:
  select:
    if: github.repository == 'repoagent/controller' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.select.outputs.changed }}
      base: ${{ steps.select.outputs.base }}
      selection: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Current main, so this tool builds on a pin an earlier tool's refresh made in this run.
          ref: main
          persist-credentials: false
      - name: Select a supported upstream release of the tool
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ inputs.tool }}
        run: python3 scripts/delivery/tool-refresh.py select "$TOOL" "$RUNNER_TEMP/tool-selection"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: archive
        if: steps.select.outputs.changed == 'true'
        with:
          name: tool-selection-${{ inputs.tool }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tool-selection/
          if-no-files-found: error
          retention-days: 7
  verify:
    needs: select
    if: needs.select.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: repoagent-controller:tool-refresh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.select.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.select.outputs.selection }}
          path: ${{ runner.temp }}/tool-selection
      - name: Pin the selected version in this checkout
        run: python3 scripts/delivery/tool-refresh.py apply "$RUNNER_TEMP/tool-selection/selection.json"
      - name: Verify the controller with the selected tools
        run: bash scripts/delivery/verify.sh "$RUNNER_TEMP/controller-package"
      - name: Build and smoke the image with the selected tools
        run: |
          set -euo pipefail
          python3 scripts/compose-image.py --source . --manifest image/default.json --output "$RUNNER_TEMP/context"
          docker build --platform linux/amd64 --target runtime --tag "$IMAGE" \
            --file "$RUNNER_TEMP/context/container/Containerfile" "$RUNNER_TEMP/context"
          mkdir "$RUNNER_TEMP/controller-image"
          cd "$RUNNER_TEMP/controller-image"
          docker run --rm --network none "$IMAGE" versions | tee versions.txt
          docker run --rm --network none --entrypoint cat "$IMAGE" /opt/repoagent/image-inventory.json > image-inventory.json
          docker run --rm --network none --entrypoint cat "$IMAGE" /opt/repoagent/controller/RELEASE_NOTES.md > RELEASE_NOTES.md
          docker run --rm --network none --entrypoint /opt/repoagent/native-smoke/NativeSmoke "$IMAGE"
          python3 "$GITHUB_WORKSPACE/scripts/delivery/image-release.py" check .
  smoke:
    needs: [select, verify]
    if: needs.select.outputs.changed == 'true'
    uses: ./.github/workflows/e2e-smoke.yml
    with:
      source_ref: ${{ needs.select.outputs.base }}
      selection: ${{ needs.select.outputs.selection }}
    secrets: inherit
    permissions:
      contents: read
      issues: write
  commit:
    needs: [select, verify, smoke]
    if: github.repository == 'repoagent/controller' && github.ref == 'refs/heads/main' && needs.select.outputs.changed == 'true'
    environment: controller-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.select.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.select.outputs.selection }}
          path: ${{ runner.temp }}/tool-selection
      - name: Pin the verified version on main and propose a semantic release
        # A GITHUB_TOKEN commit starts no push workflow, so publication is dispatched explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/delivery/tool-refresh.py commit "$RUNNER_TEMP/tool-selection/selection.json"
          gh workflow run release-please.yml --ref main || {
            echo '::error::The verified pin is on main, but publication was not dispatched. Run: gh workflow run release-please.yml --ref main' >&2
            exit 1
          }
  report-failure:
    needs: [select, verify, smoke, commit]
    if: failure() && github.repository == 'repoagent/controller' && needs.smoke.result != 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report a refused tool selection or verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOOL: ${{ inputs.tool }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Baseline tool refresh failed: $TOOL"
          printf 'Tool refresh `%s` failed. Inspect [the run](%s). Selection, verification, smoke and safe pinning must all succeed before publication. Prior pins remain authoritative; if explicit publication dispatch failed after pinning, follow the recovery diagnostic in the run.\n' "$TOOL" "$RUN_URL" > "$RUNNER_TEMP/tool-failure.md"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/tool-failure.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/tool-failure.md"
          fi
