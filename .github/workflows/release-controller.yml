name: Release controller
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag on main (optional prerelease suffix)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: controller-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: controller-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and select immutable tagged source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Verify and package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          bash scripts/delivery/verify.sh "$RUNNER_TEMP/release" "${RELEASE_TAG#v}"
      - name: Publish new release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # Existing release (including a partial upload) requires operator inspection.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserving all existing assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release/"* --verify-tag --title "$RELEASE_TAG" --notes "Linux amd64 controller. Source: $(git rev-parse HEAD). See docs/ci-cd.md for runtime requirements."
