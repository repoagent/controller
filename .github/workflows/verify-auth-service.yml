name: Verify auth service

on:
  pull_request:
    paths:
      - 'service/auth/**'
      - '.github/workflows/verify-auth-service.yml'
  push:
    branches: [main]
    paths:
      - 'service/auth/**'
      - '.github/workflows/verify-auth-service.yml'

permissions:
  contents: read

concurrency:
  group: auth-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Auth HTTP and Table integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: service/auth/global.json
      - name: Verify against pinned disposable Azurite
        working-directory: service/auth
        run: bash verify.sh
