name: Verify installers

on:
  pull_request:
    paths:
      - 'install.ps1'
      - 'install.sh'
      - 'repoagent'
      - 'repoagent.ps1'
      - 'scripts/build-image.*'
      - 'scripts/publish-image.ps1'
      - 'scripts/private-file.psm1'
      - 'scripts/revoke-approval.ps1'
      - 'scripts/enroll-controller.ps1'
      - 'scripts/host-enrollment.psm1'
      - 'scripts/plan-azure.ps1'
      - 'scripts/azure/**'
      - 'container/**'
      - 'tests/installers/**'
      - '.github/workflows/verify-installers.yml'
  push:
    paths:
      - 'install.ps1'
      - 'install.sh'
      - 'repoagent'
      - 'repoagent.ps1'
      - 'scripts/build-image.*'
      - 'scripts/publish-image.ps1'
      - 'scripts/private-file.psm1'
      - 'scripts/revoke-approval.ps1'
      - 'scripts/enroll-controller.ps1'
      - 'scripts/host-enrollment.psm1'
      - 'scripts/plan-azure.ps1'
      - 'scripts/azure/**'
      - 'container/**'
      - 'tests/installers/**'
      - '.github/workflows/verify-installers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the runtime configuration test dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Prepare the native executable test fixture
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - name: Report test tools
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual PowerShell process tests
        shell: pwsh
        run: |
          if ($IsWindows) {
            python -m unittest discover -s tests/installers -p test_private_runtime.py -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m unittest discover -s tests/installers -p test_approval_revoke.py -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m unittest discover -s tests/installers -p test_azure_plan.py -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m unittest discover -s tests/installers -p test_image_publication.py -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            python -m unittest discover -s tests/installers -v
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  windows-host-enrollment:
    name: Host enrollment and guided installer (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      REPOAGENT_TEST_WINDOWS_ROOT: LocalMachine
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the runtime configuration test dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Prepare the native executable test fixture
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - name: Run Windows host enrollment and guided installer cases with fail-fast feedback
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          python -m unittest discover -s tests/installers -p test_host_enrollment.py -f -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/installers -p test_guided_install.py -f -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
